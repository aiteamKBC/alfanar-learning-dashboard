# /etc/nginx/sites-available/alfanar  (template - replace dashboard.example.com)
server {
    listen 80;
    server_name dashboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /opt/alfanar-learning-dashboard/frontend/dist;   # Vue production build
    index index.html;

    location /api/    { proxy_pass http://127.0.0.1:8001; include proxy_params; proxy_set_header X-Forwarded-Proto https; }
    location /admin/  { proxy_pass http://127.0.0.1:8001; include proxy_params; proxy_set_header X-Forwarded-Proto https; }
    location /static/ { alias /opt/alfanar-learning-dashboard/backend/staticfiles/; expires 7d; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /        { try_files $uri /index.html; }   # SPA routes
}
